<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="degraded-banner"></div>

  <nav class="yt-tabs" role="tablist">
    <button data-view="form" role="tab" aria-selected="true">Download</button>
    <button data-view="queue" role="tab" aria-selected="false">Queue (0)</button>
  </nav>

  <!-- form.js owns this section -->
  <section id="view-form" role="tabpanel" class="yt-view">
    <div class="yt-form">
      <div class="yt-field">
        <label for="url-input">URL</label>
        <input id="url-input" type="url" placeholder="Paste a video or playlist URL" autofocus
               autocomplete="off" spellcheck="false">
        <div id="probe-status" class="yt-probe-status" aria-live="polite"></div>
      </div>

      <div id="metadata-display" class="yt-metadata" hidden>
        <div id="metadata-thumb" class="yt-metadata__thumb"></div>
        <div class="yt-metadata__info">
          <p id="metadata-title" class="yt-metadata__title"></p>
          <p id="metadata-uploader" class="yt-metadata__uploader"></p>
          <p id="metadata-duration" class="yt-metadata__duration"></p>
        </div>
      </div>

      <div class="yt-field-row">
        <div class="yt-field">
          <label for="format-select">Format</label>
          <select id="format-select">
            <option value="best">Best</option>
            <option value="mp4">MP4</option>
            <option value="webm">WebM</option>
            <option value="mp3">MP3</option>
            <option value="m4a">M4A</option>
            <option value="bestaudio">Best Audio</option>
          </select>
        </div>
        <div class="yt-field">
          <label for="quality-select">Quality</label>
          <select id="quality-select">
            <option value="best">Best</option>
            <option value="2160p">2160p (4K)</option>
            <option value="1440p">1440p</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="360p">360p</option>
          </select>
        </div>
      </div>

      <div id="playlist-container" class="yt-playlist" hidden>
        <h3 id="playlist-title" class="yt-playlist__title"></h3>
        <div class="yt-playlist__actions">
          <button type="button" id="playlist-select-all" class="yt-button yt-button--secondary yt-button--sm">Select All</button>
          <button type="button" id="playlist-deselect-all" class="yt-button yt-button--secondary yt-button--sm">Deselect All</button>
          <span id="playlist-count" class="yt-playlist__count"></span>
        </div>
        <div id="playlist-entries" class="yt-playlist__entries" role="list"></div>
      </div>

      <details class="yt-advanced">
        <summary>Advanced Options</summary>
        <div class="yt-advanced__body">
          <div class="yt-field">
            <label for="proxy-input">Proxy URL</label>
            <input id="proxy-input" type="url" placeholder="socks5://127.0.0.1:1080">
          </div>
          <div class="yt-field">
            <label for="template-input">Filename Template</label>
            <input id="template-input" type="text" placeholder="%(title)s.%(ext)s">
          </div>
          <div class="yt-field">
            <label for="args-input">Custom Arguments</label>
            <textarea id="args-input" rows="3" placeholder="One flag or value per line"></textarea>
          </div>
          <div class="yt-field">
            <label>CLI Preview</label>
            <pre id="cli-preview" class="yt-cli-preview"></pre>
          </div>
        </div>
      </details>

      <button type="button" id="enqueue-btn" class="yt-button yt-button--primary yt-button--block">
        Download
      </button>
    </div>
  </section>

  <!-- queue.js owns this section -->
  <section id="view-queue" role="tabpanel" class="yt-view" hidden>
  </section>

  <script type="module" src="./form.js"></script>
  <script type="module" src="./queue.js"></script>
  <script type="module" src="./switch.js"></script>
</body>
</html>
